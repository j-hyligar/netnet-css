<!DOCTYPE html>
<html lang="en-US">

  <head>
    <!-- your metadata goes here in the "head" -->
    <title>netnet CSS HW Basic Animation</title>
    <meta name="jayden h" content="jayden h">
    <meta name="netnet css hw" content="netnet css hw">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <style>
      
      @keyframes colorZoom {
        0% {
          color: black;
          transform: scale(1.5);
        }
        50% {
          color: green;
          transform: scale(0.9);
        }
        100% {
          color: black;
          transform: scale(1.5);
        }
      }
    
      h1 {
        text-align: center;
        padding: 20px;
        
        animation-name: colorZoom;
        animation-duration: 2s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
    
    </style>
  </head>
