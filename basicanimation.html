<!DOCTYPE html>
<html lang="en-US">

<style>
  
  @keyframes colorZoom {
    0% {
      color: black;
      transform: scale(1.5);
    }
    50% {
      color: green;
      transform: scale(0.9);
    }
    100% {
      color: black;
      transform: scale(1.5);
    }
  }

  h1 {
    text-align: center;
    padding: 20px;
    
    animation-name: colorZoom;
    animation-duration: 2s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

</style>


<h1>Welcome in!</h1>
