<!DOCTYPE html>
<html lang="en-US">

	<head>
	    <!-- your metadata goes here in the "head" -->
	    <title>netnet CSS HW Basic Positioning</title>
	    <meta name="jayden h" content="jayden h">
	    <meta name="netnet css hw" content="netnet css hw">
	    <meta name="viewport" content="width=device-width, initial-scale=1">
	
		<style>
			
		  div {
		    width: 75px;
		    height: 75px;
		    background: pink;
		    margin: 8px;
		    padding: 10px;
		    text-align: center;
		    border-radius: 60%;
		  }
		  
		  .red {
		    background: red;
		    position: relative;
		    top: 60px;
		    left: 60px;
		  }
		  
		  .green {
		    background: green;
		    position: absolute;
		    top: 80px;
		    left: 80px;
		    z-index: -1;
		  }
		  
		  .blue {
		    background: blue;
		    position: fixed;
		    top: 10px;
		    left: 151px;
		  }
		  
		  .black {
		    background: black;
		    color: white;
		    position: sticky;
		    top: 110px;
		    left: 80px;
		  }
		
		</style>
	</head>


<div>1</div>
<div class="red">2</div>
<div>3</div>
<div class="green">4</div>
<div>5</div>
